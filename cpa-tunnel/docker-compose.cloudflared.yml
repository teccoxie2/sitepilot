# Expose LAN CPA (192.168.52.81:8317) with Cloudflare Tunnel. No Fly.
# Run this on a host that can reach that address (same LAN as CLIProxyAPI).
#
# Quick tunnel (hostname is printed in logs, changes if you recreate the container):
#   docker compose -f docker-compose.cloudflared.yml up
#
# Named tunnel (stable hostname configured in Cloudflare Zero Trust):
#   copy cloudflared.env.example to .env, set TUNNEL_TOKEN
#   docker compose -f docker-compose.cloudflared.yml -f docker-compose.cloudflared.named.yml up -d
#
# Then set Vercel env with the public https origin and the CPA *client* API key
# (never the management.html login password):
#   CPA_BASE_URL=https://….trycloudflare.com CPA_API_KEY=… ./scripts/link-public-cpa.sh

services:
  cpa-cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url ${CPA_ORIGIN:-http://192.168.52.81:8317}

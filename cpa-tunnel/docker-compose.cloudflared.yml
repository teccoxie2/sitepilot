# Expose LAN CPA via Cloudflare Tunnel, behind the local allowlist gate. No Fly.
# Run on a host that can reach 192.168.52.81:8317.
#
#   cp cloudflared.env.example .env
#   # set CPA_GATE_TOKEN=$(openssl rand -hex 32)
#   docker compose -f docker-compose.cloudflared.yml --env-file .env up --build
#
# Optional IP/CIDR lines go in allowlist.txt. Empty file = token + /v1 only.

services:
  cpa-gate:
    build:
      context: .
      dockerfile: Dockerfile.gate
    restart: unless-stopped
    environment:
      CPA_ORIGIN: ${CPA_ORIGIN:-http://192.168.52.81:8317}
      CPA_GATE_TOKEN: ${CPA_GATE_TOKEN}
      CPA_ALLOWLIST_FILE: /allowlist/allowlist.txt
      PORT: "8318"
    volumes:
      - ./allowlist.txt:/allowlist/allowlist.txt:ro
    ports:
      - "127.0.0.1:8318:8318"
  cpa-cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - cpa-gate
    command: tunnel --no-autoupdate --url http://cpa-gate:8318
